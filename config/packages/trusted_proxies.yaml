# Proxies Symfony trusts, read from TRUSTED_PROXIES (set in .env / .env.local or the server environment).
# Comma separated addresses or subnets, or REMOTE_ADDR to trust the connecting proxy (e.g. Varnish on Platform.sh).
# Symfony's own default reads SYMFONY_TRUSTED_PROXIES, which this project does not set.
framework:
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port']
